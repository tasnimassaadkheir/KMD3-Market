# Runs the automated tests on GitHub every time code is pushed or a pull request is opened.
# Results appear in the repository's "Actions" tab.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:        # also allows running it by hand from the Actions tab

jobs:
  unit:
    name: Unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:unit          # no packages needed: uses Node's built-in test runner

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      # When something fails, show WHICH test and WHY on the PR page (annotation) and in the run
      # summary, so there's no need to dig through the full log.
      - name: Show failed tests
        if: failure()
        run: |
          grep -E "^\s*not ok|^\s+(error|expected|actual|code|name|message):|Error:|waiting for" e2e.log | head -60 > falhas.txt || true
          { echo "### End-to-end tests that failed"; echo '```'; cat falhas.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=End-to-end tests failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' falhas.txt)"

  api:
    name: API tests (Postman / Newman, real Supabase)
    # Only when started by hand, because it uses the real database.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:api
        env:
          KMD3_EMAIL: ${{ secrets.KMD3_EMAIL }}
          KMD3_PASSWORD: ${{ secrets.KMD3_PASSWORD }}
