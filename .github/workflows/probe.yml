name: Probe GeoSampa
on:
  push:
    branches: [probe/geosampa]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          out=probe.txt; : > $out
          log(){ echo "$@" >> $out; }
          timeout 300 node probe/crawl.mjs || true
          git config user.name probe; git config user.email probe@example.com
          git add probe; git commit -m "probe results 6"; git push
